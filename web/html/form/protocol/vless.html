{{define "form/vless"}}
<a-collapse activeKey="0" v-for="(client, index) in inbound.settings.vlesses.slice(0,1)" v-if="!isEdit">
  <a-collapse-panel header='{{ i18n "pages.inbounds.client" }}'>
    {{template "form/client"}}
  </a-collapse-panel>
</a-collapse>
<a-collapse v-else>
  <a-collapse-panel :header="'{{ i18n "pages.client.clientCount"}} : ' + inbound.settings.vlesses.length">
    <table width="100%">
      <tr class="client-table-header">
        <th>{{ i18n "pages.inbounds.email" }}</th>
        <th>ID</th>
      </tr>
      <tr v-for="(client, index) in inbound.settings.vlesses" :class="index % 2 == 1 ? 'client-table-odd-row' : ''">
        <td>[[ client.email ]]</td>
        <td>[[ client.id ]]</td>
      </tr>
    </table>
  </a-collapse-panel>
</a-collapse>
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
  <a-form-item>
    <template slot="label">
      <a-tooltip>
        <template slot="title">{{ i18n "pages.inbounds.vlessEncryptionDesc" }}</template>
        {{ i18n "pages.inbounds.vlessEncryption" }}
        <a-icon type="question-circle"></a-icon>
      </a-tooltip>
    </template>
    <a-select :value="inbound.settings.encryptionAuth" @change="auth => setVlessEnc(auth, inbound.settings.encryptionMode)"
      :dropdown-class-name="themeSwitcher.currentTheme">
      <a-select-option value="none">none</a-select-option>
      <a-select-option value="mlkem768">ML-KEM-768 ({{ i18n "pages.inbounds.postQuantum" }})</a-select-option>
      <a-select-option value="x25519">X25519</a-select-option>
    </a-select>
  </a-form-item>
  <template v-if="inbound.settings.encryptionEnabled">
    <a-form-item label="Mode">
      <a-select :value="inbound.settings.encryptionMode" @change="mode => setVlessEnc(inbound.settings.encryptionAuth, mode)"
        :dropdown-class-name="themeSwitcher.currentTheme">
        <a-select-option v-for="mode in ['native', 'xorpub', 'random']" :value="mode">[[ mode ]]</a-select-option>
      </a-select>
    </a-form-item>
    <a-form-item label="Decryption">
      <a-input v-model.trim="inbound.settings.decryption">
        <a-icon slot="addonAfter" type="sync" @click="setVlessEnc(inbound.settings.encryptionAuth, inbound.settings.encryptionMode)"></a-icon>
      </a-input>
    </a-form-item>
    <a-form-item label="Encryption">
      <a-input v-model.trim="inbound.settings.encryption"></a-input>
    </a-form-item>
  </template>
</a-form>
<template v-if="inbound.isTcp && !inbound.settings.encryptionEnabled">
  <a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
    <a-form-item label="Fallbacks">
      <a-button icon="plus" type="primary" size="small" @click="inbound.settings.addFallback()"></a-button>
    </a-form-item>
  </a-form>

  <!-- vless fallbacks -->
  <a-form v-for="(fallback, index) in inbound.settings.fallbacks" :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
    <a-divider :style="{ margin: '0' }"> Fallback [[ index + 1 ]] <a-icon type="delete" @click="() => inbound.settings.delFallback(index)" :style="{ color: 'rgb(255, 77, 79)', cursor: 'pointer' }"></a-icon>
    </a-divider>
    <a-form-item label='SNI'>
      <a-input v-model="fallback.name"></a-input>
    </a-form-item>
    <a-form-item label='ALPN'>
      <a-input v-model="fallback.alpn"></a-input>
    </a-form-item>
    <a-form-item label='Path'>
      <a-input v-model="fallback.path"></a-input>
    </a-form-item>
    <a-form-item label='Dest'>
      <a-input v-model="fallback.dest"></a-input>
    </a-form-item>
    <a-form-item label='xVer'>
      <a-input-number v-model.number="fallback.xver" :min="0" :max="2"></a-input-number>
    </a-form-item>
  </a-form>
  <a-divider :style="{ margin: '5px 0' }"></a-divider>
</template>
{{end}}
