{{define "form/amneziawg"}}
<a-alert type="info" show-icon :style="{ marginBottom: '10px' }" message='{{ i18n "pages.inbounds.amneziawgDesc" }}'></a-alert>
<a-collapse activeKey="0" v-for="(client, index) in inbound.settings.clients.slice(0,1)" v-if="!isEdit">
  <a-collapse-panel header='{{ i18n "pages.inbounds.client" }}'>
    {{template "form/client"}}
  </a-collapse-panel>
</a-collapse>
<a-collapse v-else>
  <a-collapse-panel :header="'{{ i18n "pages.client.clientCount"}} : ' + inbound.settings.clients.length">
    <table width="100%">
      <tr class="client-table-header">
        <th>{{ i18n "pages.inbounds.email" }}</th>
        <th>{{ i18n "pages.inbounds.address" }}</th>
      </tr>
      <tr v-for="(client, index) in inbound.settings.clients" :class="index % 2 == 1 ? 'client-table-odd-row' : ''">
        <td>[[ client.email ]]</td>
        <td>[[ client.address ]]</td>
      </tr>
    </table>
  </a-collapse-panel>
</a-collapse>
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
  <a-form-item>
    <template slot="label">
      <a-tooltip>
        <template slot="title">{{ i18n "reset" }}</template>
        {{ i18n "pages.xray.wireguard.secretKey" }}
        <a-icon @click="inbound.settings.secretKey = Wireguard.generateKeypair().privateKey" type="sync"></a-icon>
      </a-tooltip>
    </template>
    <a-input v-model.trim="inbound.settings.secretKey"></a-input>
  </a-form-item>
  <a-form-item label='{{ i18n "pages.xray.wireguard.publicKey" }}'>
    <a-input :value="inbound.settings.pubKey" disabled></a-input>
  </a-form-item>
  <a-form-item label='{{ i18n "pages.inbounds.address" }}'>
    <a-input v-model.trim="inbound.settings.address" placeholder="10.66.66.1/24"></a-input>
  </a-form-item>
  <a-form-item label="MTU">
    <a-input-number v-model.number="inbound.settings.mtu" :min="1280" :max="1500"></a-input-number>
  </a-form-item>
  <a-form-item label="DNS">
    <a-input v-model.trim="inbound.settings.dns"></a-input>
  </a-form-item>
  <a-form-item>
    <template slot="label">
      <a-tooltip>
        <template slot="title">{{ i18n "pages.inbounds.amneziawgParamsDesc" }}</template>
        {{ i18n "pages.inbounds.obfuscation" }}
        <a-icon @click="inbound.settings.params = Inbound.AmneziaWGSettings.randomParams()" type="sync"></a-icon>
      </a-tooltip>
    </template>
    <a-row :gutter="4">
      <a-col :span="8" v-for="k in ['jc', 'jmin', 'jmax', 's1', 's2']" :key="k">
        <a-input-number v-model.number="inbound.settings.params[k]" :min="0" :style="{ width: '100%' }" :placeholder="k"></a-input-number>
        <div class="ant-form-explain">[[ k.charAt(0).toUpperCase() + k.slice(1) ]]</div>
      </a-col>
    </a-row>
    <a-row :gutter="4">
      <a-col :span="12" v-for="k in ['h1', 'h2', 'h3', 'h4']" :key="k">
        <a-input-number v-model.number="inbound.settings.params[k]" :min="5" :max="4294967295" :style="{ width: '100%' }"></a-input-number>
        <div class="ant-form-explain">[[ k.toUpperCase() ]]</div>
      </a-col>
    </a-row>
    <div v-if="inbound.settings.paramsError" class="ant-form-explain" :style="{ color: '#f5222d' }">[[ inbound.settings.paramsError ]]</div>
  </a-form-item>
</a-form>
{{end}}
