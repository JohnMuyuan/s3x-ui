{{define "form/mtproto"}}
<a-collapse activeKey="0" v-for="(client, index) in inbound.settings.clients.slice(0,1)" v-if="!isEdit">
  <a-collapse-panel header='{{ i18n "pages.inbounds.client" }}'>
    {{template "form/client"}}
  </a-collapse-panel>
</a-collapse>
<a-collapse v-else>
  <a-collapse-panel :header="'{{ i18n "pages.client.clientCount"}} : ' + inbound.settings.clients.length">
    <table width="100%">
      <tr class="client-table-header">
        <th>{{ i18n "pages.inbounds.email" }}</th>
        <th>Key</th>
      </tr>
      <tr v-for="(client, index) in inbound.settings.clients" :class="index % 2 == 1 ? 'client-table-odd-row' : ''">
        <td>[[ client.email ]]</td>
        <td>[[ client.password ]]</td>
      </tr>
    </table>
  </a-collapse-panel>
</a-collapse>
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
  <a-form-item>
    <template slot="label">
      <a-tooltip>
        <template slot="title">{{ i18n "pages.inbounds.mtprotoDomainDesc" }}</template>
        FakeTLS Domain
        <a-icon type="question-circle"></a-icon>
      </a-tooltip>
    </template>
    <a-input v-model.trim="inbound.settings.fakeTlsDomain"></a-input>
  </a-form-item>
  <a-form-item label="Prefer IP">
    <a-select v-model="inbound.settings.preferIp" :dropdown-class-name="themeSwitcher.currentTheme">
      <a-select-option value="">prefer-ipv4</a-select-option>
      <a-select-option value="prefer-ipv6">prefer-ipv6</a-select-option>
      <a-select-option value="only-ipv4">only-ipv4</a-select-option>
      <a-select-option value="only-ipv6">only-ipv6</a-select-option>
    </a-select>
  </a-form-item>
  <a-form-item>
    <template slot="label">
      <a-tooltip>
        <template slot="title">{{ i18n "pages.inbounds.mtprotoFrontingDesc" }}</template>
        Fronting
        <a-icon type="question-circle"></a-icon>
      </a-tooltip>
    </template>
    <a-input-group compact>
      <a-input v-model.trim="inbound.settings.frontingHost" :style="{ width: '65%' }" placeholder="host"></a-input>
      <a-input-number v-model.number="inbound.settings.frontingPort" :min="0" :max="65535" :style="{ width: '35%' }" placeholder="443"></a-input-number>
    </a-input-group>
  </a-form-item>
  <a-form-item label="Max Connections">
    <a-input-number v-model.number="inbound.settings.maxConnections" :min="0" placeholder="unlimited"></a-input-number>
  </a-form-item>
</a-form>
{{end}}
