{{define "form/streamXDrive"}}
<a-alert type="info" show-icon :style="{ marginBottom: '10px' }" message='{{ i18n "pages.inbounds.xdriveDesc" }}'></a-alert>
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
    <a-form-item label="Service">
        <a-select v-model="inbound.stream.xdrive.service" :dropdown-class-name="themeSwitcher.currentTheme">
            <a-select-option value="google-drive">Google Drive</a-select-option>
            <a-select-option value="template">Template</a-select-option>
            <a-select-option value="local">Local</a-select-option>
        </a-select>
    </a-form-item>
    <a-form-item label="Remote Folder">
        <a-input v-model.trim="inbound.stream.xdrive.remoteFolder"></a-input>
    </a-form-item>
    <template v-if="inbound.stream.xdrive.service === 'google-drive'">
        <a-form-item label="Client ID">
            <a-input v-model.trim="inbound.stream.xdrive.secrets[0]"></a-input>
        </a-form-item>
        <a-form-item label="Client Secret">
            <a-input-password v-model.trim="inbound.stream.xdrive.secrets[1]"></a-input-password>
        </a-form-item>
        <a-form-item label="Refresh Token">
            <a-input-password v-model.trim="inbound.stream.xdrive.secrets[2]"></a-input-password>
        </a-form-item>
    </template>
    <a-form-item v-if="inbound.stream.xdrive.service === 'template'" label="Template">
        <a-textarea v-model="inbound.stream.xdrive.templateText" :auto-size="{ minRows: 3, maxRows: 12 }"></a-textarea>
    </a-form-item>
    <a-form-item label="Segment Bytes">
        <a-input-number v-model.number="inbound.stream.xdrive.segmentBytes" :min="0" placeholder="auto"></a-input-number>
    </a-form-item>
    <a-form-item label="Flush (ms)">
        <a-input-number v-model.number="inbound.stream.xdrive.flushIntervalMs" :min="0" placeholder="auto"></a-input-number>
    </a-form-item>
    <a-form-item label="Poll (ms)">
        <a-input-number v-model.number="inbound.stream.xdrive.pollIntervalMs" :min="0" placeholder="auto"></a-input-number>
    </a-form-item>
    <a-form-item label="Session TTL (s)">
        <a-input-number v-model.number="inbound.stream.xdrive.sessionTtlSeconds" :min="0" placeholder="auto"></a-input-number>
    </a-form-item>
    <a-form-item label="Concurrency">
        <a-input-number v-model.number="inbound.stream.xdrive.concurrency" :min="0" :max="64" placeholder="auto"></a-input-number>
    </a-form-item>
</a-form>
{{end}}
