"mtprotoKeyInvalid" = "An MTProto client key must be 32 hex characters"
"amneziawgDesc" = "AmneziaWG is WireGuard with obfuscation. Connect with AmneziaVPN or the AmneziaWG apps (copy the config file from the details), or import the link into Sub-Store for mihomo. Client traffic is NATed straight out of the server, not through Xray routing; open the UDP port in your firewall."
