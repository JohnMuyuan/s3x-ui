name: Release S3X-UI

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - '**.js'
      - '**.css'
      - '**.html'
      - '**.sh'
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'config/version'
      - 'x-ui.service'
      - '.github/workflows/release.yml'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        platform:
          - amd64
          - arm64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: |
            go.sum
            sidecar/sbcore/go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          if [ "${{ matrix.platform }}" == "arm64" ]; then
            sudo apt install gcc-aarch64-linux-gnu
          fi

      - name: Build panel
        run: |
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=${{ matrix.platform }}
          if [ "${{ matrix.platform }}" == "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
          fi
          go build -ldflags "-w -s" -o xui-release -v main.go

      - name: Build sbcore
        run: |
          cd sidecar/sbcore
          sh build.sh ${{ matrix.platform }} ../../sbcore-linux-${{ matrix.platform }}

      - name: Assemble
        run: |
          mkdir -p x-ui/bin
          mv xui-release x-ui/x-ui
          cp x-ui.service x-ui.sh x-ui/
          mv sbcore-linux-${{ matrix.platform }} x-ui/bin/
          cd x-ui/bin

          Xray_URL="https://github.com/XTLS/Xray-core/releases/download/v26.10.21/"
          if [ "${{ matrix.platform }}" == "amd64" ]; then
            Xray_ZIP=Xray-linux-64.zip
          else
            Xray_ZIP=Xray-linux-arm64-v8a.zip
          fi
          wget -q ${Xray_URL}${Xray_ZIP}
          unzip ${Xray_ZIP}
          rm -f ${Xray_ZIP} geoip.dat geosite.dat
          wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          wget -q -O geoip_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat
          wget -q -O geosite_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat
          wget -q -O geoip_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
          wget -q -O geosite_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat
          mv xray xray-linux-${{ matrix.platform }}
          chmod +x xray-linux-${{ matrix.platform }} sbcore-linux-${{ matrix.platform }}

      - name: Package
        run: tar -zcvf x-ui-linux-${{ matrix.platform }}.tar.gz x-ui

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x-ui-linux-${{ matrix.platform }}
          path: ./x-ui-linux-${{ matrix.platform }}.tar.gz

      # Not marked prerelease: install.sh resolves releases/latest, which skips prereleases.
      - name: Upload files to GH release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release' && github.event.action == 'published'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: x-ui-linux-${{ matrix.platform }}.tar.gz
          asset_name: x-ui-linux-${{ matrix.platform }}.tar.gz
